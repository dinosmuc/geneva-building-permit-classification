data:
  source: SIT_AUTOR_DOSSIER           # https://sitg.ge.ch/donnees/sit-autor-dossier
  input_field: DESCRIPTION
  excluded_fields: [TYPE_OPERATION, OPERATION]   # answer-bearing
  target_classes: [AFF, AGR, AGV, EQU, NOU, PI, REN, VIL]
  excluded_classes: [AM]

  splits:                             # calendar split: label availability shifts over time
    train_original:  {to: 2010}
    validation:      {from: 2011, to: 2012}
    test_historical: {from: 2013, to: 2013}
    test_recent:     {from: 2014, to: 2026}
    pool_unlabelled: {from: 2014, to: 2026}

  dedup:
    group_key: dossier                # no group spans two partitions
    fold_accents: true                # grouping only; model input keeps original text
    fold_punctuation: true

models:
  primary:
    id: almanach/camembertav2-base
    revision: 54cc91d6ac45a540c7e0faeb677f4dd8201d3d61
    params: 110617600
  challenger:
    id: jhu-clsp/mmBERT-base
    revision: c5955035435e2bf121cde7f3c8863ef52ff35d82

teacher:
  provider: deepseek
  model: null                         # alias unverified, needs an API key
  backup: {provider: apertus, model: swiss-ai/Apertus-v1.5-70B}
  temperature: null
  max_cost_eur: null

training:
  seeds: [13, 42, 73]
  precision: fp16                     # measured: fp16 27.2, fp32 6.4, bf16 3.9 TFLOP/s
  max_seq_length: null                # null = set by pilot, frozen before main runs
  learning_rate: null
  effective_batch_size: null
  total_updates: null
  conditions: [o_only, mixed, p_then_o, o_then_p]

evaluation:
  primary_metric: macro_f1
  primary_partition: test_recent_text_disjoint
  primary_contrast: [p_then_o, mixed]
  text_disjoint_against: [train_original, pool_accepted, validation]
  min_class_support: null
  bootstrap_samples: null
  bootstrap_cluster_by: dossier

paths:
  raw: data/raw
  prepared: data/prepared
  splits: data/splits
  results: results
