data:
  source: SIT_AUTOR_DOSSIER
  input_field: DESCRIPTION
  excluded_fields: [TYPE_OPERATION, OPERATION]
  target_classes: [AFF, AGR, AGV, EQU, NOU, PI, REN, VIL]
  excluded_classes: [AM]

  splits:
    train_original:  {to: 2010}
    validation:      {from: 2011, to: 2012}
    test_historical: {from: 2013, to: 2013}
    test_recent:     {from: 2014, to: 2026}
    pool_unlabelled: {from: 2014, to: 2026}

  dedup:
    group_key: dossier
    fold_accents: true
    fold_punctuation: true

preprocessing:
  spacy_model: fr_core_news_md
  stop_words: spacy

classical:
  token_pattern: '(?u)\b\w+\b'
  ngram_ranges: [[1, 1], [1, 2]]
  C_log2: [-5, -3, -1, 1, 3, 5, 7, 9, 11, 13, 15]
  dual: false
  max_iter: 10000
  random_state: 13

weighting:
  options: [none, medium, full]

models:
  primary:
    id: almanach/camembertav2-base
    revision: 54cc91d6ac45a540c7e0faeb677f4dd8201d3d61
    params: 110617600
    defaults:
      hidden_dropout_prob: 0.1
      attention_probs_dropout_prob: 0.1
      classifier_dropout: 0.1
      pooler: ContextPooler

selection:
  partition: validation
  metric: macro_f1
  rule: best
  camembert: weighting x seeds
  report: all weighting options
  learning_curves:
    fractions: [0.1, 0.3, 1.0]
    nested: true
    retune: [C, ngram_range]
    camembert: nothing retuned

teacher:
  provider: deepseek
  model: null
  backup: {provider: apertus, model: swiss-ai/Apertus-v1.5-70B}
  temperature: null
  max_cost_eur: null

training:
  seeds: [13, 42, 73]
  precision: fp16
  max_seq_length: 128
  batch_size: 32
  epochs: 10
  checkpoint: best
  pilot_learning_rates: [3.0e-5, 5.0e-5, 7.0e-5]
  learning_rate: 3.0e-5
  schedule: linear
  warmup_ratio: 0.1
  weight_decay: 0.01
  adam_betas: [0.9, 0.999]
  adam_epsilon: 1.0e-6
  max_grad_norm: 1.0
  conditions: [o_only, mixed, p_then_o, o_then_p]

evaluation:
  primary_metric: macro_f1
  test_policy: once
  bootstrap:
    samples: 2000
    cluster_by: dossier
    interval: percentile
    level: 0.95
    paired: true
    seed: 13
  test:
    partition: test_historical
    groups: base_dossier
    metrics: [macro_f1, accuracy, per-class F1]
    models:
      majority: {}
      linearsvc:
        - {variant: A, weighting: medium}
        - {variant: A, weighting: none}
        - {variant: B, weighting: medium}
        - {variant: B, weighting: none}
      camembert: {weighting: none, seeds: [13, 42, 73]}
    primary_comparison: [camembert, linearsvc B medium]
    secondary_comparisons:
      - [linearsvc B medium, linearsvc A medium]
      - [linearsvc B medium, linearsvc B none]
  primary_partition: test_recent_text_disjoint
  primary_contrast: [p_then_o, mixed]
  text_disjoint_against: [train_original, pool_accepted, validation]

prediction:
  weighting: none
  seed: 13

paths:
  raw: data/raw
  splits: data/splits
  processed: data/processed
  mlruns: mlruns
  results: results
  figures: results/figures
  annotations: data/annotations
