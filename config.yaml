data:
  source: SIT_AUTOR_DOSSIER           # https://sitg.ge.ch/donnees/sit-autor-dossier
  input_field: DESCRIPTION
  excluded_fields: [TYPE_OPERATION, OPERATION]   # answer-bearing
  target_classes: [AFF, AGR, AGV, EQU, NOU, PI, REN, VIL]
  excluded_classes: [AM]

  splits:                             # calendar split: label availability shifts over time
    train_original:  {to: 2010}
    validation:      {from: 2011, to: 2012}
    test_historical: {from: 2013, to: 2013}
    test_recent:     {from: 2014, to: 2026}
    pool_unlabelled: {from: 2014, to: 2026}

  dedup:
    group_key: dossier                # no group spans two partitions
    fold_accents: true                # grouping only; model input keeps original text
    fold_punctuation: true

preprocessing:                        # variant B of the classical models: lemmas, no stop words
  spacy_model: fr_core_news_md        # 3.8.0; sm: "villa" -> "viller"; lg: +0.1 pt lemmas, 12x size
  stop_words: spacy                   # spaCy 3.8.16 French list (507 words), unedited

classical:                            # TF-IDF + LinearSVC; variant A on the text, variant B on the lemmas
  token_pattern: '(?u)\b\w+\b'        # keeps single characters: digits count buildings, e.g. "3 villas"
  ngram_ranges: [[1, 1], [1, 2]]      # no trigrams: 76% (text) / 83% (lemmas) of trigram types occur in one training text
  C_log2: [-5, -3, -1, 1, 3, 5, 7, 9, 11, 13, 15]   # Hsu, Chang & Lin §3.2: C = 2^-5, 2^-3, ..., 2^15;
                                      # a best C at an edge extends the grid by two steps, documented in the report
  dual: false                         # primal solver: deterministic, and it converged at C = 2^15 where the dual one
                                      # had not after 20,000 iterations (measured on variant A, 31 Oct 2026)
  max_iter: 10000                     # C = 2^15 needed 143 (unigrams) / 1,079 (uni+bigrams) iterations; room for the
                                      # edge extension. n_iter and any ConvergenceWarning are logged per run, never silenced
  random_state: 13                    # training.seeds[0]; only the dual solver is random, fixed anyway

weighting:                            # per-row weights from the rows trained on: sample_weight (LinearSVC), loss weight (CamemBERT)
  options: [none, medium, full]       # 1 | sqrt(n / (K n_c)) rescaled to mean 1 | n / (K n_c);
                                      # Mahajan et al. 2018 compared natural, square-root and uniform sampling

models:
  primary:
    id: almanach/camembertav2-base
    revision: 54cc91d6ac45a540c7e0faeb677f4dd8201d3d61
    params: 110617600

selection:                            # pre-registered: committed before the 2013 test is scored
  partition: validation
  metric: macro_f1
  rule: best                          # the highest validation macro-F1 decides weighting, C and n-grams alike; no tie rule
  camembert: weighting x seeds        # 3 options x 3 seeds = 9 runs; the option with the best mean macro-F1 over the seeds
  report: all weighting options       # validation table for both models, with per-class scores
  learning_curves:
    fractions: [0.1, 0.3, 1.0]        # scope document §5
    nested: true                      # 10% ⊂ 30% ⊂ 100%, one draw per seed in training.seeds
    retune: [C, ngram_range]          # the selected weighting stays fixed; its weights are recomputed per subset

teacher:
  provider: deepseek
  model: null                         # alias unverified, needs an API key
  backup: {provider: apertus, model: swiss-ai/Apertus-v1.5-70B}
  temperature: null
  max_cost_eur: null

training:                             # CamemBERTav2 fine-tuning through `permits train camembert`, 3 weightings x 3 seeds
  seeds: [13, 42, 73]
  precision: fp16                     # measured: fp16 27.2, fp32 6.4, bf16 3.9 TFLOP/s; CamemBERT 2.0 fine-tuned in FP32 (Table 7)
  max_seq_length: 128                 # scope document §5; the longest training text has 55 tokens, validation 57;
                                      # batches pad to their longest row
  batch_size: 32                      # in both searched sets: CamemBERT 2.0 Table 7 (CLS) {32, 64}, DeBERTaV3 Table 11 {16, 32, 48, 64}
  epochs: 10                          # DeBERTaV3 Table 11 "Maximum Training Epochs" (He, Gao & Chen, ICLR 2023); every epoch
                                      # is trained, 10 x 962 = 9,620 updates, the schedule runs over all of them
  checkpoint: best                    # best: the epoch with the highest validation macro-F1, a tie keeps the earlier one, no
                                      # patience (DeBERTaV3 selects on the dev set); final: the last epoch, the fixed-budget
                                      # mode of the research extension. The kept epoch is logged per run
  pilot_learning_rates: [3.0e-5, 5.0e-5, 7.0e-5]   # CamemBERT 2.0 Table 7, CLS row: one run each, seed 13, weighting none,
                                      # judged by its best-epoch macro-F1; pilot weights are not stored
  learning_rate: null                 # frozen from the pilot before the 9 main runs
  schedule: linear                    # linear decay to zero: CamemBERT 2.0 Table 7, DeBERTaV3 Table 11
  warmup_ratio: 0.1                   # CamemBERT 2.0 Table 7 {0, 0.1}: 962 steps, inside DeBERTaV3 Table 11 {50, ..., 1000}
  weight_decay: 0.01                  # DeBERTaV3 Table 11 (fine-tuning)
  adam_betas: [0.9, 0.999]            # DeBERTaV3 Table 11
  adam_epsilon: 1.0e-6                # DeBERTaV3 Table 11
  max_grad_norm: 1.0                  # DeBERTaV3 Table 11
  conditions: [o_only, mixed, p_then_o, o_then_p]   # research extension

evaluation:
  primary_metric: macro_f1
  test_policy: once                   # test_historical (2013) is scored once, for every model together, after
                                      # CamemBERT is selected; test_recent (2014-2026) stays untouched in the pilot phase
  bootstrap:                          # test set only, none on validation
    samples: 2000                     # Efron & Tibshirani 1993 use B = 2000 in their own examples (bootstrap R package)
    cluster_by: dossier               # resample dossiers, the split's group key
    interval: percentile
    level: 0.95
    paired: true                      # model differences from the same resamples (Berg-Kirkpatrick et al. 2012)
  primary_partition: test_recent_text_disjoint   # research extension
  primary_contrast: [p_then_o, mixed]
  text_disjoint_against: [train_original, pool_accepted, validation]

paths:
  raw: data/raw
  splits: data/splits
  processed: data/processed
  mlruns: mlruns                      # MLflow store: mlflow.db and the artifacts of every run
  results: results
  figures: results/figures
  annotations: data/annotations
